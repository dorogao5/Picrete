server {
    listen 80;
    listen [::]:80;
    server_name picrete.com www.picrete.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://picrete.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.picrete.com;

    ssl_certificate /etc/letsencrypt/live/picrete.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/picrete.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://picrete.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name picrete.com;

    ssl_certificate /etc/letsencrypt/live/picrete.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/picrete.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    client_body_buffer_size 128k;

    include /etc/nginx/snippets/picrete-security-headers.conf;

    location = /version {
        proxy_pass http://127.0.0.1:8000/version;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        include /etc/nginx/proxy_params;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8000/readyz;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1 {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /api/v1/ {
        # Nested under ^~ so the generic API prefix cannot mask this route.
        # Backend waits 1200s for Studio; allow time to persist the result.
        location ~ ^/api/v1/courses/[^/]+/trainer/sets/generate/?$ {
            proxy_pass http://127.0.0.1:8000;
            proxy_read_timeout 1260s;
            proxy_next_upstream off;
        }
        rewrite ^(/api/v1/.+)/$ $1 break;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /assets/ {
        # Retain old hashed chunks for browsers opened before a deployment.
        root /srv/picrete/shared/frontend;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        root /srv/picrete/Front-Picrete/dist;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/picrete_access.log;
    error_log /var/log/nginx/picrete_error.log warn;
}

server {
    listen 80;
    server_name picrete.bart.cx;
    return 444;
}

server {
    listen 443 ssl;
    server_name picrete.bart.cx;
    ssl_reject_handshake on;
}
