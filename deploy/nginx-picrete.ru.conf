# Russian domain mirrors: same application releases and shared assets as .com.
# Certificate picrete.ru must cover picrete.ru, www.picrete.ru, dev.picrete.ru.
# Keep route behavior aligned with nginx-picrete.com.conf and Studio deployment.

server {
    listen 80;
    listen [::]:80;
    server_name picrete.ru www.picrete.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://picrete.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.picrete.ru;

    ssl_certificate /etc/letsencrypt/live/picrete.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/picrete.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://picrete.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name picrete.ru;

    ssl_certificate /etc/letsencrypt/live/picrete.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/picrete.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    client_body_buffer_size 128k;

    include /etc/nginx/snippets/picrete-security-headers.conf;

    location = /version {
        proxy_pass http://127.0.0.1:8000/version;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8000/healthz;
        include /etc/nginx/proxy_params;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8000/readyz;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1 {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /api/v1/ {
        rewrite ^(/api/v1/.+)/$ $1 break;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /assets/ {
        # Retain old hashed chunks for browsers opened before a deployment.
        root /srv/picrete/shared/frontend;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        root /srv/picrete/Front-Picrete/dist;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/picrete_access.log;
    error_log /var/log/nginx/picrete_error.log warn;
}

server {
    listen 80;
    listen [::]:80;
    server_name dev.picrete.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://dev.picrete.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.picrete.ru;

    ssl_certificate /etc/letsencrypt/live/picrete.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/picrete.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/picrete-studio;
    index index.html;

    include /etc/nginx/snippets/picrete-security-headers.conf;

    # Lecture decks and exam compilations can be substantially larger than a
    # typical handout. Keep this aligned with STUDIO_KB_MAX_FILE_MB.
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_set_header X-Request-Id $request_id;
        # LLM-сравнения и DataLab OCR работают долго
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /version {
        proxy_pass http://127.0.0.1:8100/version;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8100/healthz;
        include /etc/nginx/proxy_params;
    }

    location ^~ /assets/ {
        root /srv/picrete/shared/studio;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/picrete-security-headers.conf;
        try_files $uri /index.html;
    }
}
